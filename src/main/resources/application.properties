# CampusCare Application Configuration

server.port=${SERVER_PORT:8080}

# Database Configuration with Environment Variable Fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campuscare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${UPLOAD_DIR:uploads}

# JWT Secret & Expiration Configuration (24 Hours)
campuscare.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
campuscare.jwt.expiration=86400000

# Logging
logging.level.com.campuscare=INFO
logging.level.org.springframework.security=INFO
